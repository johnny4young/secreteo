name: Spike TCC ad-hoc

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tcc-adhoc:
    name: Ad-hoc cdhash TCC
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and sign ad-hoc
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sw_vers
          xcodebuild -version
          bash spikes/tcc-adhoc/build.sh build one

      - name: Assert ad-hoc signature
        run: |
          for app in build/SpikeSender.app build/SpikeReceiver.app; do
            details="$(codesign -dvvv -r- "$app" 2>&1)"
            echo "$details"
            echo "$details" | grep -q 'Signature=adhoc'
            echo "$details" | grep -q 'designated => cdhash H"'
            if echo "$details" | grep -q '^Authority='; then
              echo "::error::$app has a signing authority"
              exit 1
            fi
          done

      - name: Run the checks
        run: python3 spikes/tcc-adhoc/verify.py "$PWD/build" "$RUNNER_TEMP/tcc-result.json"

      - name: Keep the result
        if: always()
        run: cat "$RUNNER_TEMP/tcc-result.json" || true
