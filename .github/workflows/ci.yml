name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: scripts/check-repository-hygiene.sh

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/run-ci-swiftlint.sh

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      code: ${{ steps.scope.outputs.code }}
      delivery: ${{ steps.scope.outputs.delivery }}
      release: ${{ steps.scope.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # main requires up-to-date branches, so a merge lands the tree its pull request proved.
          if [ "$EVENT_NAME" = push ] && python3 scripts/ci_reuse_gate.py "$GITHUB_REPOSITORY" "$HEAD_SHA"; then
            printf 'code=false\ndelivery=false\nrelease=false\n' | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          # A manual run has no diff, and an empty list runs everything.
          if [ -n "$BASE_SHA" ]; then
            git diff --name-only "$BASE_SHA...$HEAD_SHA" > changed.txt
          else
            : > changed.txt
          fi
          python3 scripts/ci_changes.py < changed.txt | tee -a "$GITHUB_OUTPUT"

  unit:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: macos-26
    timeout-minutes: 6
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/verify-ci-toolchain.sh 26 26.6
      # build-cache.yml saves main's .build; SwiftPM rebuilds only what this checkout changed.
      # A stalled download gives up as a miss instead of spending the job's budget. A changed
      # Package.swift never restores: products of a removed target would still satisfy imports.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
        with:
          path: .build
          key: swiftpm-build-macos-26-xcode-26.6-${{ hashFiles('Package.swift') }}-${{ hashFiles('Package.resolved') }}-
          restore-keys: swiftpm-build-macos-26-xcode-26.6-${{ hashFiles('Package.swift') }}-
      - run: swift build -Xswiftc -warnings-as-errors
      - run: swift test --parallel -Xswiftc -warnings-as-errors

  ui-smoke:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: macos-26
    timeout-minutes: 8
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/verify-ci-toolchain.sh 26 26.6
      - run: scripts/install-ci-xcodegen.sh "$RUNNER_TEMP/xcodegen"
      - run: scripts/run-ui-tests.sh smoke build/pr-screenshots
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-screenshots
          path: build/pr-screenshots
          if-no-files-found: ignore
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-results
          path: build/ui-smoke.xcresult
          retention-days: 3

  signed-handoff:
    needs: changes
    if: needs.changes.outputs.delivery != 'false'
    runs-on: macos-26
    timeout-minutes: 12
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/verify-ci-toolchain.sh 26 26.6
      - run: scripts/run-signed-handoff.sh

  release-dryrun:
    needs: changes
    if: needs.changes.outputs.release != 'false'
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/verify-ci-toolchain.sh 26 26.6
      - run: scripts/install-ci-xcodegen.sh "$RUNNER_TEMP/xcodegen"
      - run: scripts/release-dryrun.sh

  gate:
    if: always()
    needs: [hygiene, lint, changes, unit, ui-smoke, signed-handoff, release-dryrun]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_gate.py "$NEEDS"
