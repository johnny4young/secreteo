name: Update Homebrew cask

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release to serve, such as v0.1.0"
        required: true

permissions:
  contents: read

jobs:
  update-cask:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: homebrew
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish the bytes of the published release
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not vX.Y.Z"; exit 1; }
          version="${TAG#v}"
          if [[ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != "false" ]]; then
            echo "::error::$TAG is not published"
            exit 1
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "Secreteo-$version.dmg*" --dir "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP" && sha256sum --check "Secreteo-$version.dmg.sha256")
          sha256="$(cut -d' ' -f1 "$RUNNER_TEMP/Secreteo-$version.dmg.sha256")"
          scripts/update-homebrew-tap.sh "$version" "$sha256"
