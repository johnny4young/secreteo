version: 2

updates:
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      swift-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "*FluidAudio*"
    ignore:
      # The speech engine moves only through an explicit review with paired
      # recognition and resource evidence.
      - dependency-name: "*FluidAudio*"
    labels:
      - dependencies
      - swift

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions
