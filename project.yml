# Source of truth for Secreteo.xcodeproj, which is generated and git-ignored.
name: Secreteo

options:
  bundleIdPrefix: com.johnny4young
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
  knownRegions:
    - en
    - es
    - Base

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    # One source for the version, so the number Sparkle compares can never be forgotten.
    CURRENT_PROJECT_VERSION: $(MARKETING_VERSION)
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    # One Debug binary: the launcher stub detaches from a menu bar agent.
    ENABLE_DEBUG_DYLIB: NO
    DEAD_CODE_STRIPPING: YES
    # Ad-hoc by default. Distribution signing happens in the release workflow.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    # Empty until the release key exists. scripts/package-release.sh refuses to ship without it.
    SPARKLE_PUBLIC_ED_KEY: ""

packages:
  Secreteo:
    path: "."

targets:
  Secreteo:
    type: application
    platform: macOS
    sources:
      - path: Apps/Secreteo
      - path: THIRD-PARTY-NOTICES.md
        buildPhase: resources
    dependencies:
      - package: Secreteo
        product: AppUI
      # The read-only MCP server, which MCP clients launch from inside the app.
      - target: secreteo-mcp
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      # From scripts/fetch-sparkle.sh, with the tools at the same version.
      - framework: Vendor/Sparkle.framework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johnny4young.secreteo
        PRODUCT_NAME: Secreteo
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        # On since Portavoz's cooperating version shipped; check_release.py still asks for GLOBAL_DICTATION_CLEARED.
        SECRETEO_GLOBAL_DICTATION: YES
    info:
      path: Apps/Secreteo/Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        NSMicrophoneUsageDescription: Secreteo uses the microphone only while you dictate.
        DictationOwnershipProtocol: 1
        SecreteoGlobalDictation: $(SECRETEO_GLOBAL_DICTATION)
        SUFeedURL: https://github.com/johnny4young/secreteo/releases/latest/download/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableAutomaticChecks: true
        NSHumanReadableCopyright: "© 2026 Johnny Young"

  secreteo-mcp:
    type: tool
    platform: macOS
    sources:
      - path: Sources/secreteo-mcp
    dependencies:
      - package: Secreteo
        product: DictationAgents
    settings:
      base:
        PRODUCT_NAME: secreteo-mcp
        SKIP_INSTALL: YES

  SecreteoUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/SecreteoUITests
    dependencies:
      - target: Secreteo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johnny4young.secreteo.uitests
        GENERATE_INFOPLIST_FILE: YES
        # The runner must not be sandboxed, or it drops the launch arguments.
        ENABLE_APP_SANDBOX: NO

schemes:
  Secreteo:
    build:
      targets:
        Secreteo: all
    test:
      config: Debug
      targets:
        - SecreteoUITests
